<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf9f7"><title>MODEL — Descobrir</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="app"><header class="top"><div class="brand">MODEL</div><div class="top-actions"><button class="icon-button" id="notifications" aria-label="Notificações"><img src="../assets/icons/bell.svg" alt=""></button><button class="avatar-button" id="modelPanel" title="Painel demonstrativo do modelo" aria-label="Painel do modelo">M</button></div></header>
<main id="main"><nav class="tabs" aria-label="Abas de descoberta"><button class="tab active" data-tab="discover">Descobrir</button><button class="tab" data-tab="favorites">Favoritos</button><button class="tab" data-tab="interests">Interesses <span id="interestCount"></span></button></nav>
<section class="heading"><div><h1 id="pageTitle">Descobrir</h1><p id="pageSubtitle">Explore talentos e encontre seu próximo modelo.</p></div><button class="icon-button filter-trigger" id="filterOpen" aria-label="Abrir filtros"><img src="../assets/icons/ruler.svg" alt=""></button></section>
<div id="activeFilters" class="active-filters"></div><div class="cards" id="cards"></div><div id="empty" class="empty" hidden><h2>Nenhum modelo encontrado</h2><p>Experimente ajustar seus filtros.</p><button id="resetEmpty" class="dark-button">Limpar filtros</button></div>
</main><nav class="bottom-nav" aria-label="Navegação principal"><button class="nav-item selected" data-nav="discover"><img src="../assets/icons/portfolio.svg" alt="" aria-hidden="true">Descobrir</button><button class="nav-item" data-nav="messages"><img src="../assets/icons/message.svg" alt="" aria-hidden="true">Mensagens</button><button class="nav-item" data-nav="projects"><img src="../assets/icons/id-card.svg" alt="" aria-hidden="true">Projetos</button><button class="nav-item" data-nav="profile"><img src="../assets/icons/user-check.svg" alt="" aria-hidden="true">Perfil</button></nav></div>
<dialog id="filters"><form method="dialog" id="filterForm"><div class="dialog-head"><h2>Filtros</h2><button class="close" value="cancel" aria-label="Fechar">×</button></div><label>Categoria<select id="category"><option value="all">Todas</option><option>Editorial</option><option>Fitness</option><option>Comercial</option><option>Fashion</option></select></label><label>Biotipo<select id="build"><option value="all">Todos</option><option value="athletic">Atlético</option><option value="strong">Musculoso e peludo</option><option value="young">Jovem adulto</option></select></label><div class="age-row"><label>Idade mínima<input id="minAge" type="number" min="21" max="70" value="21"></label><label>Idade máxima<input id="maxAge" type="number" min="21" max="70" value="70"></label></div><label class="check"><input id="available" type="checkbox"> Apenas disponíveis</label><div class="dialog-actions"><button type="button" id="clearFilters" class="light-button">Limpar</button><button type="submit" class="dark-button">Aplicar</button></div></form></dialog>
<dialog id="profileDialog" class="profile-dialog"><div id="profileContent"></div></dialog><dialog id="modelDialog"><div id="modelContent"></div></dialog><div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
